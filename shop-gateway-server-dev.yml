server:
  port: 8882

spring:
  application:
    name: shop-gateway-server
  profiles:
    active: dev

  # 1. 게이트웨이 라우팅 설정 (중요: 컨피그 서버 대신 로컬에서 직접 설정)
  cloud:
    gateway:
      routes:
        - id: shop-member-service
          uri: lb://SHOP-MEMBER-SERVICE  # 유레카 대시보드에 뜬 이름과 대소문자까지 일치해야 함
          predicates:
            - Path=/api/members/** # /api/members로 시작하는 모든 요청을 전달

    # 2. 컨피그 서버 연결 끄기 (로컬 테스트를 위해 잠시 비활성화)
    config:
      enabled: false
      import-check:
        enabled: false

# 3. 유레카 클라이언트 설정
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

# 4. 아까 404 떴던 /actuator/gateway/routes를 보기 위한 설정
management:
  endpoints:
    web:
      exposure:
        include: "gateway,health,info" # 또는 "*" 로 설정
  endpoint:
    gateway:
      enabled: true # 게이트웨이 엔드포인트 자체를 활성화
